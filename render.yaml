services:
  # ---------- API ----------
  - type: web
    name: dsign-print-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm run seed:admin && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: true
      - key: CLIENT_URL
        value: https://dsign-print-client.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_NAME
        value: Super Admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Exigées par le schéma Zod, mais nodemailer n'est utilisé nulle part
      # dans le code actuel : des valeurs factices suffisent.
      - key: SMTP_HOST
        value: smtp.example.com
      - key: SMTP_USER
        value: unused
      - key: SMTP_PASSWORD
        value: unused
      - key: SMTP_FROM_EMAIL
        value: contact@dsignprint.com
      - key: SMTP_FROM_NAME
        value: D-sign Print

  # ---------- Frontend ----------
  - type: web
    name: dsign-print-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        value: /api
    routes:
      # L'ordre compte : l'API d'abord, puis le fallback SPA (React Router)
      - type: rewrite
        source: /api/*
        destination: https://dsign-print-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html